<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 图标：现在用的是占位版（蓝底白 w 的 SVG）。
         正式图标是 512×512 的 /public/favicon.png，做好后把下面这行注释打开即可：
         <link rel="apple-touch-icon" sizes="512x512" href="/favicon.png" /> -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>witkit 妙计科技 · 以科技聚力改变未来</title>
    <meta
      name="description"
      content="妙计科技（witkit）做开发工具。HEC 负责全域互联与统一授权，UEF 负责全栈工程与 AI 协作，CEP 提供数据库、对象存储与人机验证能力。"
    />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- 社交分享封面：图片位 og-cover（1200 × 630）。做好后放进 public/og-cover.png，
         再把下面几行的注释打开。现在先不开，避免分享出去是个坏缩略图。
    <meta property="og:type" content="website" />
    <meta property="og:title" content="witkit 妙计科技 · 以科技聚力改变未来" />
    <meta property="og:image" content="/og-cover.png" />
    -->
    <!-- 字体：全站使用系统字体栈，不加载外部 Web Font。
         理由：国内访问 Google Fonts 不稳定会拖慢首屏；系统字体在中文环境下
         渲染质量已经足够（PingFang SC / 微软雅黑），且零请求成本。 -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
