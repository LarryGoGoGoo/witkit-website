<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" font-family="'PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',-apple-system,'Segoe UI',sans-serif" role="img" aria-label="E时代信任中心">
  <title>E时代信任中心</title>

  <!-- 与 ecd.svg / eoss.svg 共用同一套坐标，产品页里图标与文字严格一条线。
       副标题「TRUST CENTER」取自信任中心站真实界面标题，非杜撰。 -->
  <rect width="720" height="450" fill="#FFFFFF"/>

  <!-- 图标容器 -->
  <rect x="64" y="165" width="120" height="120" rx="28" fill="#EEF4FF"/>

  <!-- 盾牌图标 -->
  <g transform="translate(88,189) scale(3)" fill="none" stroke="#0052D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>
    <path d="m9 12 2 2 4-4"/>
  </g>

  <!-- 名称 + 副标题 -->
  <text x="224" y="215" font-size="34" font-weight="700" fill="#0B0F19">E时代信任中心</text>
  <text x="224" y="255" font-size="21" fill="#4E5969">TRUST CENTER</text>
</svg>
